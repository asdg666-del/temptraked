<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temp Tracker</title>
    <link rel="stylesheet" href="./estilos.css" />
  </head>
  <body>
    <div class="contenedor">
      <div class="buscador">
        <input
          type="text"
          placeholder="Ingresa nombre de la ciudad"
          spellcheck="false"
          autocomplete="off"
          id="input-ciudad"
        />
        <button onclick="obtenerClima()">
          <img src="buscar.jpg" alt="buscar" />
        </button>
      </div>

      <div class="clima-info">
        <p class="clima-texto">Esperando ciudad...</p>
        <img src="clima-ejemplo.jpg" class="clima-icono" alt="icono clima" />
        <h1 class="temp">--°C</h1>
        <h2 class="ciudad">--</h2>
        <div class="detalles">
          <div class="col">
            <img src="Humedad.jpg" alt="humedad" />
            <div>
              <p class="Humedad">--%</p>
              <p>Humedad</p>
            </div>
          </div>

          <div class="col">
            <img src="viento.jpg" alt="viento" />
            <div>
              <p class="viento">-- km/h</p>
              <p>Viento</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./coldigo.js"></script>
  </body>
</html>
